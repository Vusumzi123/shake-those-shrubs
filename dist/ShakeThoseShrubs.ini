[ShakeThoseShrubs]
; Pin one placed reference (xEdit: the REFR FormID, e.g. Skyrim.esm|0x0ABC12).
; Leave 0 to affect the nearest matching shrub within Radius instead.
TargetRef=0

; TreePineShrub01Snow. Matching reads the runtime base form, so Base Object Swapper
; replacements are seen as they are, and only count if they match a rule below.
BaseForm=0x0009DAA2
; Base-form model path substrings (comma separated) that count as a shrub.
; Empty disables tag matching.
TagEditorID=Shrub,Bush,Fern,Thistle,Brush
; Also treat harvestable plants (FLOR, or any base with a produce item) as shrubs.
Harvestable=1
; Extra base forms to shake, comma separated (Plugin.esp|0xFormID or 0xFormID).
; Community patches go in Data/SKSE/Plugins/ShakeThoseShrubsPatches/*.ini as BaseForms=...
BaseForms=
; Write the matched base forms to Data/SKSE/Plugins/ShakeThoseShrubs_bases.txt.
DumpBaseForms=0

; Sound Descriptor; plays on entry and again each cooldown while moving in contact. 0 disables it.
Sound=0x00000DD0

; Horizontal distance, in game units, that counts as touching the shrub.
Radius=90

; Peak tilt of the impact wobble, in degrees.
YawDegrees=4
PitchDegrees=3

; Wobble frequency (Hz) and decay per second (higher = snappier).
Speed=2.5
Spring=2.2

; Share of the angle held while the player stays in contact, and how fast it eases.
LeanFraction=0.5
LeanRate=8
VelocityInfluence=1
RetriggerCooldown=0.5
MoveThreshold=20
MinImpact=0.3
MaxImpact=1
ImpactSpeed=350
SoundVolume=1
SoundEnabled=1

; 1 = log player speed and active shrubs once per second.
Debug=0
