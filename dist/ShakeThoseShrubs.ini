[ShakeThoseShrubs]
; Pin one placed reference (xEdit: the REFR FormID, e.g. Skyrim.esm|0x0ABC12).
; Leave 0 to affect the nearest TreePineShrub01Snow within Radius instead.
TargetRef=0

; TreePineShrub01Snow. Replacer-agnostic: replacers change the mesh, not the base form.
BaseForm=0x0009DAA2

; Sound Descriptor played once per pass. 0 disables it.
Sound=0x00000DD0

; Horizontal distance, in game units, that counts as touching the shrub.
Radius=90

; Peak tilt of the impact wobble, in degrees.
YawDegrees=4
PitchDegrees=3

; Wobble frequency (Hz) and decay per second (higher = snappier).
Speed=2.5
Spring=2.2

; Share of the angle held while the player stays in contact, and how fast it eases.
LeanFraction=0.5
LeanRate=8
VelocityInfluence=1
MinImpact=0.3
MaxImpact=1
ImpactSpeed=350
SoundVolume=1
SoundEnabled=1

; 1 = log player speed and active shrubs once per second.
Debug=0
